name: build-and-push

on:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pi_version:
        description: "pi version to build (blank = npm latest)"
        default: ""
      force:
        description: "Build even if the version tag already exists"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow: only the CloakBrowser pin check
    # writes anything, and the build job below should stay read-only.
    # `issues: write` is NOT granted by default when a workflow declares any
    # permissions block, and without it `gh issue create` fails 403.
    permissions:
      contents: read
      issues: write
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      pi_version: ${{ steps.decide.outputs.pi_version }}
    steps:
      - name: Resolve pi version and whether it needs building
        id: decide
        env:
          IMAGE: davidsiaw/pi-sandbox
          INPUT_VERSION: ${{ github.event.inputs.pi_version }}
          FORCE: ${{ github.event.inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="$(curl -fsSL https://registry.npmjs.org/@earendil-works/pi-coding-agent/latest \
              | grep -oE '"version":"[^"]+"' | head -1 | cut -d'"' -f4)"
          fi
          if [ -z "${version}" ]; then
            echo "Could not resolve pi version" >&2
            exit 1
          fi
          echo "pi_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved pi version: ${version}"

          # Always build on push/tag events (source changed).
          if [ "${EVENT}" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "push event -> build"
            exit 0
          fi

          if [ "${FORCE}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "force -> build"
            exit 0
          fi

          # For schedule/dispatch: build only if the version tag is missing.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${version}")"
          if [ "${code}" = "200" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "tag ${version} already exists -> skip"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag ${version} missing (http ${code}) -> build"
          fi

      # The Dockerfile pins an exact CloakBrowser release for reproducibility,
      # which means it does not follow upstream on its own. This turns a pin that
      # rots SILENTLY into one that rots loudly.
      #
      # It files an ISSUE rather than emitting ::warning::. A warning only
      # appears in the run summary of a nightly job that otherwise passes, and
      # nobody reads a green run -- which is the same silence the pin was
      # supposed to remove. An issue persists and nags.
      #
      # It deliberately does NOT open a PR or commit the bump: a push to master
      # builds and publishes to Docker Hub, so an unattended bump would ship an
      # untested browser as :latest and undo the whole point of pinning.
      #
      # Uses GITHUB_TOKEN: unauthenticated GitHub API is 60/hour per IP and a
      # shared runner IP burns that fast. Exactly one API call to CloakHQ.
      - name: Checkout (for the pinned CloakBrowser tag)
        uses: actions/checkout@v7

      - name: File an issue if a newer free CloakBrowser release exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          pinned="$(grep -oP '^ARG CLOAKBROWSER_VERSION=\K.*' Dockerfile || true)"
          if [ -z "${pinned}" ] || [ "${pinned}" = "auto" ]; then
            echo "CloakBrowser is not pinned; nothing to compare."
            exit 0
          fi
          echo "Pinned CloakBrowser release: ${pinned}"

          resp="$(curl -sSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/CloakHQ/CloakBrowser/releases?per_page=30')"
          newest="$(printf '%s' "$resp" | node -e '
            let raw="";
            process.stdin.on("data",d=>raw+=d);
            process.stdin.on("end",()=>{
              let data; try { data = JSON.parse(raw); } catch { process.exit(0); }
              if (!Array.isArray(data)) process.exit(0);
              const free = data.find(r =>
                r && r.tag_name && !/-pro$/i.test(r.tag_name) && !r.draft &&
                (r.assets||[]).some(a => /linux-x64\.(tar\.gz|zip)$/.test(a.name||"")));
              if (free) process.stdout.write(free.tag_name);
            });')"

          if [ -z "${newest}" ]; then
            echo "Could not determine the newest free release (rate limit or API shape change); skipping."
            exit 0
          fi
          echo "Newest free release:        ${newest}"

          if [ "${newest}" = "${pinned}" ]; then
            echo "Pin is current."
            exit 0
          fi

          # Idempotent: this job runs nightly, so only file once per drift.
          # Closing the issue after bumping lets a LATER release open a new one.
          open_count="$(gh issue list --repo "${REPO}" --state open --limit 100 \
            --json title --jq '[.[] | select(.title | startswith("CloakBrowser pin is behind"))] | length' 2>/dev/null || echo 0)"
          if [ "${open_count}" != "0" ]; then
            echo "An open CloakBrowser pin issue already exists; not filing another."
            exit 0
          fi

          gh issue create --repo "${REPO}" \
            --title "CloakBrowser pin is behind: ${newest} is available" \
            --body "$(cat <<EOF
          The Dockerfile pins CloakBrowser to \`${pinned}\`, but a newer **free**
          release is available: \`${newest}\`.

          The pin is intentional (see the comment above \`ARG CLOAKBROWSER_VERSION\`
          in the Dockerfile) — it keeps the published image reproducible instead of
          drifting with whatever is newest-and-free. Upgrading is therefore a
          deliberate step, not something CI should do on its own: a push to master
          builds and publishes to Docker Hub, so an untested browser would ship as
          \`:latest\`.

          To upgrade:

          1. Test it locally first:
             \`\`\`bash
             CLOAKBROWSER_VERSION=${newest} docker buildx build --platform linux/amd64 -t davidsiaw/pi-sandbox:latest --load .
             sh smoketest.sh
             \`\`\`
             The suite covers CloakBrowser specifically: binary present, \`--version\`
             works, a real page fetch, and that the baked release is not a \`-pro\` build.
          2. If green, bump \`ARG CLOAKBROWSER_VERSION=\` in the Dockerfile and close this issue.

          Closing without bumping is fine too — a future release will file a fresh issue.

          _Filed automatically by the nightly \`check\` job._
          EOF
          )"
          echo "Filed an issue for ${newest}."

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      PI_VERSION: ${{ needs.check.outputs.pi_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 image for testing (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          # PA_UITAG_MODEL_URL is OPTIONAL: leave the repo variable unset and the
          # uitag-export stage builds yolo-ui.onnx from the pinned PyPI wheel.
          # Set it (Settings -> Secrets and variables -> Actions -> Variables) to
          # point at a self-hosted copy and skip that stage's ~1GB toolchain.
          build-args: |
            PI_VERSION=${{ needs.check.outputs.pi_version }}
            PA_UITAG_MODEL_URL=${{ vars.PA_UITAG_MODEL_URL }}
          tags: davidsiaw/pi-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash smoketest.sh

      - name: Build and push (both arches)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PI_VERSION=${{ needs.check.outputs.pi_version }}
            PA_UITAG_MODEL_URL=${{ vars.PA_UITAG_MODEL_URL }}
          tags: |
            davidsiaw/pi-sandbox:latest
            davidsiaw/pi-sandbox:${{ needs.check.outputs.pi_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
